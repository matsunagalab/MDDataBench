[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mddatabench"
version = "0.1.0"
description = "Benchmark for LLM-agent molecular dynamics, scored against public MDDB reference simulations"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Matsunaga Lab, Saitama University" }]
dependencies = [
    "gemmi>=0.7.0",
    "numpy>=1.24.0",
    "mdtraj>=1.9.0",
]
# OpenMM is required to score submissions but is best installed from
# conda-forge; see README.

[project.urls]
Repository = "https://github.com/matsunagalab/MDDataBench"

[project.scripts]
mddatabench = "mddatabench.__main__:main"
mddatabench-sbatch = "mddatabench.sbatch_shim:main"

[tool.hatch.build.targets.wheel]
packages = ["mddatabench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests requiring heavy scientific dependencies or long runtimes",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
